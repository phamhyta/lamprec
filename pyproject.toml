[project]
name = "lamprec"
version = "0.2.0"
description = "LAMP-Rec: label-free anytime-valid performance monitor for streaming recommenders (public interface skeleton)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

# The public skeleton needs only numpy. The released implementation adds the
# stack under the `full` extra; `dev` runs the public portion of the test
# suite.
[project.optional-dependencies]
dev = ["pytest>=7.0"]
full = [
    "scipy>=1.10",
    "matplotlib>=3.8",      # figures
    "river>=0.21",          # prequential-delayed / ADWIN baselines
    "pot>=0.9",             # IUPM optimal-transport label transport
    "pandas>=2.0",          # OBP / KuaiRand adapters read raw CSVs
    "pyarrow>=12",
    "pytest>=7.0",
]

# NOTE: the `obp` library is intentionally NOT a dependency. It hard-pins
# scipy==1.9.3 (incompatible with numpy 2.x / scipy>=1.10). The Open Bandit
# Dataset is plain CSV; the adapter reads it directly.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lamprec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
